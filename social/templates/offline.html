{% include 'header.html' %}

<style>
  :root {
    --mfy-bg: #fafafa;
    --mfy-white: #ffffff;
    --mfy-text: #262626;
    --mfy-text-light: #8e8e8e;
    --mfy-primary: #0095f6;
    --mfy-border: #dbdbdb;
  }

  .mfy-offline-wrap {
    min-height: calc(100vh - 54px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--mfy-bg);
  }

  .mfy-offline-card {
    max-width: 360px;
    width: 100%;
    text-align: center;
  }

  .mfy-offline-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--mfy-white);
    border: 1px solid var(--mfy-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mfy-offline-icon i {
    font-size: 28px;
    color: var(--mfy-text-light);
  }

  .mfy-offline-card h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--mfy-text);
    margin-bottom: 8px;
  }

  .mfy-offline-card p {
    font-size: 14px;
    color: var(--mfy-text-light);
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .mfy-offline-retry {
    background: var(--mfy-white);
    color: var(--mfy-text);
    border: 1px solid var(--mfy-border);
    border-radius: 24px;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .mfy-offline-retry:hover  { background: var(--mfy-bg); border-color: var(--mfy-text-light); }
  .mfy-offline-retry:active { transform: scale(0.98); }
  .mfy-offline-retry:disabled { opacity: 0.6; cursor: default; }
  .mfy-offline-retry i { margin-right: 6px; }
</style>

<div class="mfy-offline-wrap">
  <div class="mfy-offline-card">
    <div class="mfy-offline-icon"><i class="fas fa-wifi"></i></div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <button class="mfy-offline-retry" id="mfyOfflineRetryBtn" onclick="mfyOfflineRetry()">
      <i class="fas fa-rotate-right"></i> Retry
    </button>
  </div>
</div>

<script>
  function mfyOfflineRetry() {
    var btn = document.getElementById('mfyOfflineRetryBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
    fetch('/home', { method: 'HEAD', cache: 'no-store' })
      .then(function () { window.location.href = '/home'; })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-rotate-right"></i> Retry';
      });
  }

  window.addEventListener('online', function () {
    window.location.href = '/home';
  });
</script>
