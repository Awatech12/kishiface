{% load static %}
{% load pwa %}
<html lang="en">  
<head>  
  <meta charset="utf-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1" />  
   {% progressive_web_app_meta %}
  <script src="{% static 'js/pwa-install.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <style>  
  
    :root {
      --nav-bg: rgba(255, 255, 255, 0.97);
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.06);
      --nav-icon-color: #8e8e8e;
      --nav-icon-active: #0095f6;
      --nav-accent: #0095f6;
      --nav-border: #dbdbdb;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
    }  
    
    /* === FLOATING PILL NAVIGATION === */
    .bottom-nav { 
      position: fixed; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 92%; 
      max-width: 420px; 
      height: 65px; 
      
      background: var(--nav-bg); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      
      border-radius: 35px; 
      box-shadow: var(--nav-shadow); 
      border: 1px solid var(--nav-border);
      
      display: flex; 
      align-items: center; 
      justify-content: space-evenly;
      padding: 0 5px;
      z-index: 1000; 
      
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s;
    }
    
    .bottom-nav.hidden { 
      transform: translate(-50%, 150%); 
      opacity: 0; 
      pointer-events: none;
    }
    
    /* === NAV ITEMS (all icons including center) === */
    .nav-item { 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 58px;
      height: 54px;
      color: var(--nav-icon-color); 
      font-size: 20px; 
      text-decoration: none;
      position: relative;
      transition: color 0.2s, transform 0.1s;
      border-radius: 16px;
    }
    
    .nav-item .nav-label {
      font-size: 9px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;
      color: inherit;
    }

    .nav-item.active { 
      color: var(--nav-icon-active); 
    }
    
    .nav-item:active {
      transform: scale(0.9);
    }

    @media (max-width: 360px) {
      .bottom-nav { width: 96%; height: 60px; }
      .nav-item { font-size: 18px; width: 50px; }
      .nav-item .nav-label { font-size: 8px; }
    }

    /* === CREATE OPTIONS MODAL === */
    .create-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .create-modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .create-modal {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .create-modal-overlay.open .create-modal {
      transform: translateY(0);
    }

    .create-modal-handle {
      width: 40px;
      height: 4px;
      background: var(--nav-border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .create-modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #262626;
      margin: 0 0 18px;
      text-align: center;
    }

    .create-modal-options {
      display: flex;
      justify-content: space-evenly;
      gap: 10px;
    }

    .create-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #262626;
      flex: 1;
    }

    .create-option-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--nav-accent);
      transition: transform 0.15s, background 0.15s;
    }

    .create-option:active .create-option-icon {
      transform: scale(0.92);
      background: #e3f2fd;
    }

    .create-option-label {
      font-size: 12px;
      font-weight: 500;
    }

    /* === MOBILE-ONLY VISIBILITY === */
    /* Hide the bottom nav by default (tablet/desktop) */
    .bottom-nav {
      display: none;
    }

    /* Show it only on mobile-sized viewports */
    @media (max-width: 767px) {
      .bottom-nav {
        display: flex;
      }
    }
  </style>  
</head>  
<body>  

<!-- Navigation Bar -->
<nav class="bottom-nav" id="bottomNav">
    
    <!-- 1. Home -->
    <a href="{% url 'home' %}" 
       class="nav-item {% if request.path == '/' or 'home' in request.path %}active{% endif %}" 
       title="Home">
        <i class="fas fa-home"></i>
        <span class="nav-label">Home</span>
    </a>
    
    <!-- 2. Marketplace -->
    <a href="{% url 'market' %}" 
       class="nav-item {% if '/market' in request.path %}active{% endif %}" 
       title="Marketplace">
        <i class="fas fa-shopping-bag"></i>
        <span class="nav-label">Market</span>
    </a>
    
    <!-- 3. Create (opens upload options modal) -->
    <a href="#" 
       class="nav-item" 
       id="createNavBtn"
       title="Create">
        <i class="fas fa-plus"></i>
        <span class="nav-label">Create</span>
    </a>

    <!-- 4. Jobs -->
    <a href="{% url 'job_vacancy' %}" 
       class="nav-item {% if '/jobs' in request.path %}active{% endif %}" 
       title="Jobs">
        <i class="fas fa-briefcase"></i>
        <span class="nav-label">Jobs</span>
    </a>
    
    <!-- 5. Businesses -->
    <a href="{% url 'business_pages_list' %}" 
       class="nav-item {% if '/business_pages_list' in request.path %}active{% endif %}" 
       title="Businesses">
        <i class="fas fa-store"></i>
        <span class="nav-label">Businesses</span>
    </a>

</nav>  

<!-- Create Options Modal -->
<div class="create-modal-overlay" id="createModalOverlay">
  <div class="create-modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <div class="create-modal-handle"></div>
    <p class="create-modal-title" id="createModalTitle">What would you like to post?</p>
    <div class="create-modal-options">
      {% if viewer_primary_business_page %}
      <a href="{% url 'business_page_detail' slug=viewer_primary_business_page.slug %}" class="create-option">
        <span class="create-option-icon"><i class="fas fa-tag"></i></span>
        <span class="create-option-label">Product</span>
      </a>
      {% else %}
      <a href="{% url 'business_page_create' %}" class="create-option">
        <span class="create-option-icon"><i class="fas fa-tag"></i></span>
        <span class="create-option-label">Product</span>
      </a>
      {% endif %}
      <a href="{% url 'job_vacancy' %}" class="create-option">
        <span class="create-option-icon"><i class="fas fa-briefcase"></i></span>
        <span class="create-option-label">Job</span>
      </a>
      <a href="{% url 'event_calendar' %}" class="create-option">
        <span class="create-option-icon"><i class="fas fa-calendar-plus"></i></span>
        <span class="create-option-label">Event</span>
      </a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {

    var bottomNav  = document.getElementById('bottomNav');

    // ── Scroll hide / show ────────────────────────────────────────────────
    var lastScrollTop  = 0;
    var scrollThreshold = 10;
    var isNavVisible   = true;

    function handleScroll() {
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      var scrollDelta = scrollTop - lastScrollTop;

      if (scrollTop < 0 || scrollTop + window.innerHeight > document.documentElement.scrollHeight) return;

      if (Math.abs(scrollDelta) > scrollThreshold) {
        if (scrollDelta > 0 && isNavVisible) {
          bottomNav.classList.add('hidden');
          isNavVisible = false;
        } else if (scrollDelta < 0 && !isNavVisible) {
          bottomNav.classList.remove('hidden');
          isNavVisible = true;
        }
        lastScrollTop = scrollTop;
      }
    }

    var scrollTimeout;
    window.addEventListener('scroll', function () {
      if (!scrollTimeout) {
        scrollTimeout = setTimeout(function () {
          handleScroll();
          scrollTimeout = null;
        }, 100);
      }
    });

    // Always show nav on touch/click (UX improvement)
    function showNav() {
      if (!isNavVisible) {
        bottomNav.classList.remove('hidden');
        isNavVisible = true;
      }
    }
    document.addEventListener('touchstart', showNav);
    document.addEventListener('mousedown', showNav);

    // ── Create options modal ────────────────────────────────────────────
    var createNavBtn     = document.getElementById('createNavBtn');
    var createModalOverlay = document.getElementById('createModalOverlay');

    function openCreateModal() {
      createModalOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCreateModal() {
      createModalOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    if (createNavBtn && createModalOverlay) {
      createNavBtn.addEventListener('click', function (e) {
        e.preventDefault();
        openCreateModal();
      });

      // Close when tapping the dark backdrop (not the sheet itself)
      createModalOverlay.addEventListener('click', function (e) {
        if (e.target === createModalOverlay) {
          closeCreateModal();
        }
      });

      // Close on Escape (useful for desktop testing)
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeCreateModal();
      });
    }

  });
</script>

  {% if user.is_authenticated %}
  {% include 'onlineStatus.html' %}
  {% endif %}
</body>  
</html>
